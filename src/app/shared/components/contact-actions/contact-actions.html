@if (map(); as href) {
  <a
    class="action focus-ring"
    [href]="href"
    target="_blank"
    rel="noopener noreferrer"
    [attr.aria-label]="('actions.map' | translate) + ': ' + name()"
  >
    <ion-icon name="location-outline" aria-hidden="true" />
    <!-- @if (!compact()) {
      <span>{{ 'actions.map' | translate }}</span>
    } -->
    </a>
}
@if (phone()) {
<div class="grid grid-cols-2 gap-2">

  <!-- Call -->
  <a [href]="'tel:' + phone()" class="flex min-h-11 items-center justify-center gap-2
                     rounded-xl bg-brand-700 px-3 py-2.5
                     text-sm font-semibold text-white
                     transition-colors hover:bg-brand-800
                     active:scale-[0.98]">
    <ion-icon name="call-outline" class="text-lg"></ion-icon>
    <!-- <span>{{ 'common.call' | translate }}</span> -->
    </a>

  <!-- WhatsApp -->
  <a [href]="whatsappUrl()" target="_blank" rel="noopener noreferrer" class="flex min-h-11 items-center justify-center gap-2
                     rounded-xl border border-brand-700/20
                     bg-brand-50 px-3 py-2.5
                     text-sm font-semibold text-brand-800
                     transition-colors hover:bg-brand-100
                     active:scale-[0.98]">
    <ion-icon name="logo-whatsapp" class="text-lg"></ion-icon>
    <span>WhatsApp</span>
    </a>
  </div>
  }
