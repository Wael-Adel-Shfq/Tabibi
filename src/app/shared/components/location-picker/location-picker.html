<div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
  @for (level of levels(); track level.index) {
    <div>
      <label class="mb-1 block text-sm font-semibold text-slate-800" [attr.for]="idPrefix() + '-' + level.index">
        @if (level.labelKey) {
          {{ level.labelKey | translate }}
        } @else {
          @for (kind of level.kinds; track kind) {
            {{ 'locationKinds.' + kind | translate }}@if (!$last) { / }
          }
        }
      </label>
      <app-search-select
        [inputId]="idPrefix() + '-' + level.index"
        [options]="level.choices"
        [value]="level.selected"
        [placeholder]="placeholderFor(level)"
        [invalid]="invalid()"
        [describedBy]="!level.loading && level.options.length === 0 ? idPrefix() + '-' + level.index + '-empty' : null"
        [disabled]="level.loading || (level.options.length === 0 && !(allowAdd() && level.parent))"
        [actionLabel]="allowAdd() && level.parent ? 'locations.addNew' : null"
        (picked)="onSelect(level, $event)"
        (action)="onAdd(level)"
      />
      @if (!level.loading && level.options.length === 0) {
        <p class="mt-1 text-xs text-slate-600" [id]="idPrefix() + '-' + level.index + '-empty'">
          {{ (allowAdd() ? 'locations.noneYetAdd' : 'locations.noneYetHint') | translate }}
        </p>
      }
    </div>
  }
</div>
