<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      @if (backHref()) {
        <ion-back-button [defaultHref]="backHref()" [attr.aria-label]="'common.back' | translate" text="" />
      } @else {
        <ion-menu-button menu="public-menu" [attr.aria-label]="'nav.openMenu' | translate" />
      }
    </ion-buttons>
    <ion-title class="p-2">{{ title() | translate }}</ion-title>
