<div class="mb-4">
  <label class="mb-1 block text-sm font-semibold text-slate-800" [attr.for]="for()">
    {{ label() | translate }}
    @if (required()) {
      <span class="text-red-700" aria-hidden="true">*</span>
      <span class="sr-only">({{ 'common.required' | translate }})</span>
    }
  </label>
  <ng-content />
  @if (hint()) {
    <p class="mt-1 text-xs text-slate-600">{{ hint() | translate }}</p>
  }
  @if (errorKind(); as kind) {
    <p class="mt-1 text-sm font-semibold text-red-700" role="alert">
      {{ 'errors.' + kind | translate }}
    </p>
  }
</div>
