<app-public-header title="doctors.title" />

<ion-content>
  <main class="mx-auto max-w-3xl space-y-4 p-4">
    <h1 class="sr-only">{{ 'doctors.title' | translate }}</h1>

    <app-directory-search
      inputId="doctor-search"
      label="doctors.searchLabel"
      placeholder="doctors.searchPlaceholder"
      [value]="filter.doctorTerm()"
      (valueChange)="onTerm($event)"
    />

    <app-ad-slot placement="doctors_list" />

    <section aria-labelledby="doctor-results" aria-live="polite">
      <h2 id="doctor-results" class="mb-2 text-sm font-semibold text-slate-700">
        @if (list.loaded()) {
          {{ 'common.results' | translate: { count: list.total() } }}
        }
      </h2>

      @if (list.error()) {
        <app-error-state (retry)="list.reload()" />
      } @else if (list.empty()) {
        <app-empty-state message="doctors.none" />
      } @else {
        <ul class="grid grid-cols-2 gap-3 sm:grid-cols-3">
          @for (doctor of list.items(); track doctor.id) {
            <li><app-doctor-card [doctor]="doctor" /></li>
          }
        </ul>
        @if (list.loading() && list.items().length === 0) {
          <app-loading-state />
        }
      }
    </section>
  </main>

  <ion-infinite-scroll [disabled]="!list.hasMore()" (ionInfinite)="onInfinite($event)">
    <ion-infinite-scroll-content />
  </ion-infinite-scroll>
</ion-content>

<app-ad-popup placement="popup_doctors" />
