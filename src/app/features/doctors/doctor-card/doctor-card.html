<article class="tile card">
  <app-listing-photo size="fill" [src]="photo()" kind="doctor" />
  <div class="body">
    <h3 class="name">
      <a class="stretched" [routerLink]="['/doctors', doctor().id]">{{ doctor().full_name }}</a>
    </h3>
    <p class="specialty">{{ language.name(doctor().specialty) }}</p>
    <p class="place">{{ language.chain(place()) }}</p>
  </div>
  <div class="actions">
    <app-contact-actions
      [compact]="true"
      /* [phone]="doctor().clinic_phone" */
      [place]="doctor()"
      [name]="doctor().full_name"
    />
  </div>
</article>
