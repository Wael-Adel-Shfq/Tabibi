<article class="card p-4">
  <h3 class="text-base font-bold text-slate-900">{{ facility().name }}</h3>
  <p class="text-sm font-semibold text-brand-800">
    {{ 'facilityTypes.' + facility().type | translate }}
  </p>
  <p class="mt-1 text-sm text-slate-700">
    {{ language.chain(facility().location_chain) }}
  </p>
  <p class="text-sm text-slate-700">{{ facility().address }}</p>
  @if (facility().phone; as phone) {
    <p class="text-sm text-slate-700">
      <span class="sr-only">{{ 'fields.phone' | translate }}: </span>
      <span dir="ltr">{{ phone }}</span>
    </p>
  }

  <div class="mt-3 flex flex-wrap gap-2">
    <app-contact-actions [phone]="facility().phone" [place]="facility()" [name]="facility().name" />
  </div>
</article>
