<h2 mat-dialog-title>
  {{ (data.item ? 'admin.tips.edit' : 'admin.tips.add') | translate }}
</h2>

<form novalidate (submit)="onSubmit($event)">
  <mat-dialog-content>
    <app-form-field label="fields.tipAr" for="tip-ar" [field]="tip.text_ar" [required]="true" hint="hints.tipText">
      <textarea id="tip-ar" class="control" rows="3" lang="ar" dir="rtl" [formField]="tip.text_ar"></textarea>
    </app-form-field>

    <app-form-field label="fields.tipEn" for="tip-en" [field]="tip.text_en" hint="hints.tipEnglish">
      <textarea id="tip-en" class="control" rows="3" lang="en" dir="ltr" [formField]="tip.text_en"></textarea>
    </app-form-field>

    <app-form-field
      label="fields.sortOrder"
      for="tip-order"
      [field]="tip.sort_order"
      [required]="true"
      hint="hints.tipOrder"
    >
      <input id="tip-order" class="control" type="text" inputmode="numeric" dir="ltr" [formField]="tip.sort_order" />
    </app-form-field>

    <label class="check">
      <input type="checkbox" [formField]="tip.is_active" />
      <span>{{ 'fields.active' | translate }}</span>
    </label>

    @if (failure(); as key) {
      <p class="mt-3 font-semibold text-red-700" role="alert">{{ key | translate }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button matButton type="button" mat-dialog-close>{{ 'common.cancel' | translate }}</button>
    <button matButton="filled" type="submit" [disabled]="tip().submitting()">
      {{ 'common.save' | translate }}
    </button>
  </mat-dialog-actions>
</form>
